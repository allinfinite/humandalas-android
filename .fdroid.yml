Summary: Create a shared five-step intention with a circle of people
Description: |-
  Humandalas is a simple offline group practice for gathering with intention.

  Build a complete Humandala in five stages: Connection, Intention,
  Cultivation, Offering, and Anchor. Follow a guided practice or browse the
  complete 46-card library. There are no accounts, ads, analytics, purchases,
  tracking, or network access.

